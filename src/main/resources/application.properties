# Definir el puerto
server.port=8082

############################################
# Configuración de Spring Boot

# Formato de fecha y hora en la consola
logging.pattern.dateformat=hh:mm

# Ocultar el banner de Spring Boot
spring.main.banner-mode=off

# Desactivar caché de Thymeleaf durante el desarrollo
spring.thymeleaf.cache=false

############################################
# Conexión local a la BD HealthNow en MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/healthnow

# Usuario y contraseña de MySQL
spring.datasource.username=root
spring.datasource.password=zxcvbnm/*12345-

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################################
# Configuración de JPA e Hibernate

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Crear las tablas que falten sin eliminar las existentes
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en la consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE