
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- HEAD GENERAL -->
    <head th:fragment="head">

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <title>HealthNow</title>

        <style>

            :root {
                --azul: #0089be;           /* botones */
                --azul-oscuro: #17415b;    /* títulos y textos fuertes */
                --barra-superior: #0076a8; /* franja de usuario */
                --header: #34a5d2;         /* barra de navegación */
                --pie: #087eae;            /* footer */
                --azul-suave: #eaf7fc;     /* encabezados de tabla, etiquetas */
                --verde: #25a56a;
                --fondo: #f5f9fc;
                --texto: #17415b;
                --gris: #5b7384;
                --borde: #e3edf3;
                --sombra: 0 8px 28px rgba(23, 65, 91, 0.08);
            }
            * {
                box-sizing: border-box;
            }
            html, body{
                width: 100%;
                min-height: 100%;
                margin: 0;
            }
            body {
                min-height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
                background: var(--fondo);
                color: var(--texto);
                display: grid;
                grid-template-rows: auto 1fr auto;

            }

            /* ENCABEZADO GENERAL */

            .encabezado {
                background: var(--header);
                padding: 18px 6%;
            }

            .barra-superior {
                background: var(--barra-superior);
                padding: 8px 6%;
            }
            .barra-superior-contenido {
                max-width: 1200px;
                margin: auto;
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 12px;
            }
            .boton-salir {
                background: transparent;
                color: white;
                border: 1px solid white;
                border-radius: 999px;
                padding: 6px 18px;
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
            }
            .boton-salir:hover {
                background: rgba(255,255,255,.15);
            }

            .encabezado-contenido {
                max-width: 1200px;
                margin: auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
            }

            .logo {
                color: white;
                font-size: 25px;
                font-weight: bold;
                text-decoration: none;
            }

            /* NAVEGACIÓN */

            .navegacion {
                display: flex;
                align-items: center;
                gap: 22px;
            }

            .navegacion a {
                color: white;
                text-decoration: none;
                font-size: 14px;
            }

            .navegacion a:hover {
                text-decoration: underline;
            }

            /* INFORMACIÓN DEL USUARIO */

            .navegacion .enlace-usuario {
                display: flex;
                align-items: center;
                gap: 10px;
                color: white;
                text-decoration: none;
                cursor: pointer;
                padding: 5px 10px;
                border-radius: 8px;
                transition: background 0.2s ease;
            }

            .enlace-usuario:hover {
                background: rgba(255, 255, 255, 0.12);
                text-decoration: none !important;
            }

            /* ÍCONO DEL USUARIO */

            .icono-usuario {
                width: 34px;
                height: 34px;
                border: 1px solid white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 19px;
                flex-shrink: 0;
            }

            /* NOMBRE Y ROL */

            .datos-usuario {
                display: flex;
                flex-direction: column;
                gap: 3px;
                text-align: left;
            }

            .datos-usuario strong {
                font-size: 13px;
                color: white;
            }

            .datos-usuario small {
                font-size: 11px;
                color: white;
            }

            /* CONTENIDO GENERAL */

            .contenido {
                max-width: 1200px;
                margin: 40px auto;
                padding: 0 20px;
            }

            .tarjeta {
                background: white;
                padding: 32px;
                border-radius: 16px;
                border: 1px solid var(--borde);
                box-shadow: 0 8px 28px rgba(25, 67, 105, 0.08);
            }

            /* BOTONES */

            .boton {
                display: inline-block;
                padding: 12px 20px;
                border: none;
                border-radius: 9px;
                font-size: 14px;
                font-weight: bold;
                text-decoration: none;
                cursor: pointer;
            }

            .boton-verde {
                background: var(--verde);
                color: white;
            }

            .boton-azul {
                background: var(--azul);
                color: white;
            }

            .boton-gris {
                background: #edf2f7;
                color: #42566c;
            }

            /* MENSAJES */

            .mensaje-exito {
                max-width: 1200px;
                margin: 20px auto;
                padding: 15px 20px;
                background: #e4f7ed;
                color: #176b42;
                border-radius: 10px;
            }

            /* PIE DE PÁGINA */

            .pie-pagina {
                width: 100%;
                margin: 0;
                padding: 25px 20px;
                text-align: center;
                background: var(--pie);
                color: white;
                font-size: 13px;
            }
            .pie-pagina p{
                margin: 0;
            }



            /* RESPONSIVE */

            @media (max-width: 768px) {

                .encabezado-contenido {
                    flex-direction: column;
                }

                .navegacion {
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 15px;
                }

                .tarjeta {
                    padding: 22px;
                }

                .contenido-pagina{
                    flex: 1;
                    width: 100%;
                }

            }

            /* Bootstrap (pantallas de citas) */
            .btn-primary {
                --bs-btn-bg: #0089be;
                --bs-btn-border-color: #0089be;
                --bs-btn-hover-bg: #0076a8;
                --bs-btn-hover-border-color: #0076a8;
                --bs-btn-active-bg: #0076a8;
                --bs-btn-active-border-color: #0076a8;
            }
            .btn-outline-primary {
                --bs-btn-color: #0089be;
                --bs-btn-border-color: #0089be;
                --bs-btn-hover-bg: #0089be;
                --bs-btn-hover-border-color: #0089be;
            }
            .table-light {
                --bs-table-bg: #eaf7fc;
                --bs-table-color: #17415b;
            }

            /* FORMULARIOS */
            .contenido form label {
                display: block;
                margin: 18px 0 6px;
                font-size: 14px;
                font-weight: 600;
                color: var(--texto);
            }
            .contenido form input[type="text"],
            .contenido form input[type="email"],
            .contenido form input[type="password"],
            .contenido form input[type="tel"],
            .contenido form input[type="number"],
            .contenido form select,
            .contenido form textarea {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--borde);
                border-radius: 9px;
                font-size: 14px;
                color: var(--texto);
                background: #fff;
                outline: none;
                transition: border-color .2s, box-shadow .2s;
            }
            .contenido form input:focus,
            .contenido form select:focus,
            .contenido form textarea:focus {
                border-color: var(--azul);
                box-shadow: 0 0 0 3px rgba(0, 137, 190, 0.15);
            }

            /* BOTONES DE FORMULARIO */
            .acciones-formulario {
                display: flex;
                gap: 12px;
                margin-top: 28px;
                flex-wrap: wrap;
            }
            .boton {
                transition: background .2s, transform .2s;
            }
            .boton:hover {
                transform: translateY(-2px);
            }
            .boton-azul:hover  {
                background: #0076a8;
            }
            .boton-verde:hover {
                background: #1e8e5a;
            }
            .boton-gris:hover  {
                background: #dfe7ee;
            }


        </style>

    </head>

    <body>

        <!-- HEADER GENERAL -->

        <header th:fragment="header"
                class="encabezado">

            <div class="encabezado-contenido">

                <!-- LOGO -->

                <a class="logo" th:href="@{/}">
                    HealthNow
                </a>

                <!-- NAVEGACIÓN -->

                <nav class="navegacion">

                    <!-- INICIO -->

                    <a th:href="@{/}">
                        Inicio
                    </a>

                    <!-- ESPECIALIDADES -->

                    <a th:href="@{/especialidad/listado}">
                        Especialidades
                    </a>

                    <!-- INICIAR SESIÓN -->

                    <a th:href="@{/login}"
                       sec:authorize="isAnonymous()">
                        Iniciar sesión
                    </a>

                    <!-- INFORMACIÓN PERSONAL -->
                    <!-- SOLO USUARIOS AUTENTICADOS -->

                    <a th:href="@{/perfil}"
                       sec:authorize="isAuthenticated()"
                       class="enlace-usuario"
                       title="Ver información personal">

                        <!-- ÍCONO -->

                        <span class="icono-usuario">
                            &#9786;
                        </span>

                        <!-- NOMBRE Y ROL -->

                        <span class="datos-usuario">

                            <strong sec:authentication="name">
                                Usuario
                            </strong>

                            <!-- PACIENTE -->

                            <small sec:authorize="hasRole('PACIENTE')">
                                Paciente
                            </small>

                            <!-- DOCTOR -->

                            <small sec:authorize="hasRole('DOCTOR')">
                                Doctor
                            </small>

                            <!-- ADMINISTRADOR -->

                            <small sec:authorize="hasRole('ADMIN')">
                                Administrador
                            </small>

                        </span>

                    </a>

                    <!-- CERRAR SESIÓN -->

                    <form th:action="@{/logout}"
                          method="post"
                          sec:authorize="isAuthenticated()">

                        <button type="submit"
                                class="boton boton-gris">
                            Cerrar sesión
                        </button>

                    </form>

                </nav>

            </div>

        </header>

        <!-- MENSAJES DE CONFIRMACIÓN -->

        <section th:fragment="mostrarToast">

            <div th:if="${mensaje != null}"
                 class="mensaje-exito"
                 th:text="${mensaje}">
            </div>

        </section>

        <!-- FOOTER GENERAL -->

        <footer th:fragment="footer"
                class="pie-pagina">

            <p>
                © 2026 HealthNow - Sistema de Gestión de Citas Médicas
            </p>

        </footer>

    </body>

</html>
