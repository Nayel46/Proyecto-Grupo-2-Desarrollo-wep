<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="contenido-pagina">

            <!-- NOTIFICACIONES -->
            <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

            <!-- ======================================= -->
            <!-- VISTA PARA ADMINISTRADOR -->
            <!-- ======================================= -->

            <div sec:authorize="hasRole('ADMIN')">

                <th:block th:if="${medicos == null}">
                    <section th:replace="~{especialidad/fragmentos :: listado}"></section>
                </th:block>

                <th:block th:if="${medicos != null}">
                    <section th:replace="~{especialidad/fragmentos :: medicos}"></section>
                </th:block>

            </div>

            <!-- ======================================= -->
            <!-- VISTA PARA PACIENTE Y DOCTOR -->
            <!-- ======================================= -->

            <div sec:authorize="hasAnyRole('PACIENTE','DOCTOR')">

                <th:block th:if="${medicos == null}">
                    <section th:replace="~{especialidad/fragmentos :: servicios}"></section>
                </th:block>

                <th:block th:if="${medicos != null}">
                    <section th:replace="~{especialidad/fragmentos :: medicos}"></section>
                </th:block>

            </div>

        </main>

        <!-- PIE DE PÁGINA -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
