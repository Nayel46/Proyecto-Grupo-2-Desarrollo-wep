<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - HealthNow</title>

    <!-- Archivo CSS -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <main class="auth-container">

        <header class="auth-header">
            <h1>HealthNow</h1>
            <p>Tu salud, nuestra prioridad</p>
        </header>

        <h2>Iniciar sesión</h2>

        <!-- Mensaje cuando las credenciales son incorrectas -->
        <div class="error-message" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>

        <!-- Mensaje cuando se cierra sesión -->
        <div class="success-message" th:if="${param.logout}">
            Has cerrado sesión correctamente.
        </div>

        <!-- Mensaje después del registro -->
        <div class="success-message" th:if="${param.registroExitoso}">
            ¡Tu cuenta se creó correctamente! Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">Nombre de usuario</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn-primary">
                Iniciar sesión
            </button>

        </form>

        <p class="auth-link">
            ¿No tienes una cuenta?
            <a th:href="@{/registro}">Regístrate aquí</a>
        </p>

        <p class="auth-link">
            <a th:href="@{/}">Volver al inicio</a>
        </p>

    </main>

</body>
</html>
