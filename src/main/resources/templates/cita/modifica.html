<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas - HealthNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                HealthNow
            </a>
            <span class="navbar-text text-white">
                Gestión de citas médicas
            </span>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <h2 class="fw-bold mb-3"
                    th:text="${modoEdicion} ? 'Editar cita médica' : 'Agendar cita médica'">
                    Agendar cita médica
                </h2>

                <p class="text-muted mb-4">
                    Complete los datos para gestionar su cita médica.
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <form th:action="${modoEdicion} ? @{/cita/actualizar/{id}(id=${cita.idCita})} : @{/cita/guardar}"
                              method="post">

                            <div class="mb-3">
                                <label for="idDoctor" class="form-label">
                                    Doctor
                                </label>

                                <select class="form-select"
                                        id="idDoctor"
                                        name="idDoctor"
                                        required>

                                    <option value="">Seleccione un doctor</option>

                                    <option th:each="doctor : ${doctores}"
                                            th:value="${doctor.idUsuario}"
                                            th:text="${doctor.nombre + ' ' + doctor.apellidos}"
                                            th:selected="${modoEdicion and cita.doctor != null and cita.doctor.idUsuario == doctor.idUsuario}">
                                    </option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fecha" class="form-label">
                                        Fecha de la cita
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           id="fecha"
                                           name="fecha"
                                           th:value="${cita.fecha}"
                                           required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="hora" class="form-label">
                                        Hora de la cita
                                    </label>

                                    <input type="time"
                                           class="form-control"
                                           id="hora"
                                           name="hora"
                                           th:value="${cita.hora}"
                                           required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="modalidad" class="form-label">
                                    Modalidad
                                </label>

                                <select class="form-select"
                                        id="modalidad"
                                        name="modalidad"
                                        required>

                                    <option value="PRESENCIAL"
                                            th:selected="${cita.modalidad == 'PRESENCIAL'}">
                                        Presencial
                                    </option>

                                    <option value="VIRTUAL"
                                            th:selected="${cita.modalidad == 'VIRTUAL'}">
                                        Virtual
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="motivo" class="form-label">
                                    Motivo de la consulta
                                </label>

                                <textarea class="form-control"
                                          id="motivo"
                                          name="motivo"
                                          rows="4"
                                          maxlength="500"
                                          placeholder="Describa el motivo de su consulta"
                                          th:text="${cita.motivo}"
                                          required></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2">

                                <a th:href="@{/cita/listado}"
                                   class="btn btn-outline-secondary">
                                    Regresar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="${modoEdicion} ? 'Guardar cambios' : 'Agendar cita'">
                                    Agendar cita
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
