<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

    <header th:replace="~{general/fragmentos :: header}"></header>

    <main class="contenido">
        <div style="max-width: 780px; margin: 0 auto;">

            <h1 style="color: var(--azul-oscuro); margin: 0 0 8px;"
                th:text="${modoEdicion} ? 'Editar cita médica' : 'Agendar cita médica'">
                Agendar cita médica
            </h1>

            <p style="color: var(--gris); margin: 0 0 24px;">
                Complete los datos para gestionar su cita médica.
            </p>

            <div th:if="${error}"
                 class="mensaje-error"
                 th:text="${error}">
            </div>

            <div class="tarjeta">

                <form th:action="${modoEdicion} ? @{/cita/actualizar/{id}(id=${cita.idCita})} : @{/cita/guardar}"
                      method="post">

                    <div class="mb-3">
                        <label for="idEspecialidad" class="form-label">
                            Especialidad médica
                        </label>

                        <select class="form-select"
                                id="idEspecialidad"
                                name="idEspecialidad"
                                required>

                            <option value="">Seleccione una especialidad</option>

                            <option th:each="especialidad : ${especialidades}"
                                    th:value="${especialidad.idEspecialidad}"
                                    th:text="${especialidad.nombre}"
                                    th:selected="${idEspecialidadSeleccionada != null and idEspecialidadSeleccionada == especialidad.idEspecialidad}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="idDoctor" class="form-label">
                            Doctor
                        </label>

                        <select class="form-select"
                                id="idDoctor"
                                name="idDoctor"
                                required>

                            <option value="">Seleccione un doctor</option>

                            <option th:each="doctor : ${doctores}"
                                    th:value="${doctor.idUsuario}"
                                    th:text="${doctor.nombre + ' ' + doctor.apellidos}"
                                    th:selected="${modoEdicion and cita.doctor != null and cita.doctor.idUsuario == doctor.idUsuario}">
                            </option>
                        </select>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label">
                                Fecha de la cita
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="fecha"
                                   name="fecha"
                                   th:value="${cita.fecha}"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="hora" class="form-label">
                                Hora de la cita
                            </label>

                            <input type="time"
                                   class="form-control"
                                   id="hora"
                                   name="hora"
                                   th:value="${cita.hora}"
                                   required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="modalidad" class="form-label">
                            Modalidad
                        </label>

                        <select class="form-select"
                                id="modalidad"
                                name="modalidad"
                                required>

                            <option value="PRESENCIAL"
                                    th:selected="${cita.modalidad == 'PRESENCIAL'}">
                                Presencial
                            </option>

                            <option value="VIRTUAL"
                                    th:selected="${cita.modalidad == 'VIRTUAL'}">
                                Virtual
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="nombreCompleto" class="form-label">
                            Nombre completo del paciente
                        </label>

                        <input type="text"
                               class="form-control"
                               id="nombreCompleto"
                               th:value="${paciente != null ? paciente.nombre + ' ' + paciente.apellidos : ''}"
                               placeholder="Nombre completo del paciente"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label for="cedula" class="form-label">
                            Cédula de identidad
                        </label>

                        <input type="text"
                               class="form-control"
                               id="cedula"
                               th:value="${paciente != null ? paciente.cedula : ''}"
                               placeholder="Cédula de identidad"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label for="motivo" class="form-label">
                            Motivo de la consulta / Comentarios
                        </label>

                        <textarea class="form-control"
                                  id="motivo"
                                  name="motivo"
                                  rows="4"
                                  maxlength="500"
                                  placeholder="Describa el motivo de su consulta"
                                  th:text="${cita.motivo}"
                                  required></textarea>
                    </div>

                    <div class="acciones-formulario" style="justify-content: flex-end;">

                        <a th:href="@{/cita/listado}" class="boton boton-gris">
                            Regresar
                        </a>

                        <button type="submit"
                                class="boton boton-azul"
                                th:text="${modoEdicion} ? 'Guardar cambios' : 'Agendar cita'">
                            Agendar cita
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>

    <script th:inline="javascript">

        const especialidadSelect =
                document.getElementById("idEspecialidad");

        const doctorSelect =
                document.getElementById("idDoctor");

        const urlDoctores =
                /*[[@{/cita/doctores}]]*/ "/cita/doctores";

        especialidadSelect.addEventListener("change", async function () {

            const idEspecialidad = this.value;

            doctorSelect.innerHTML =
                    '<option value="">Seleccione un doctor</option>';

            if (!idEspecialidad) {
                return;
            }

            doctorSelect.disabled = true;

            try {

                const respuesta = await fetch(
                        urlDoctores + "?idEspecialidad="
                        + encodeURIComponent(idEspecialidad)
                );

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar los doctores.");
                }

                const doctores = await respuesta.json();

                doctores.forEach(doctor => {

                    const opcion = document.createElement("option");

                    opcion.value = doctor.idUsuario;
                    opcion.textContent = doctor.nombreCompleto;

                    doctorSelect.appendChild(opcion);

                });

                if (doctores.length === 0) {
                    doctorSelect.innerHTML =
                            '<option value="">No hay doctores disponibles</option>';
                }

            } catch (error) {

                console.error("Error al cargar doctores:", error);

                doctorSelect.innerHTML =
                        '<option value="">Error al cargar doctores</option>';

            } finally {

                doctorSelect.disabled = false;

            }

        });

    </script>

</body>
</html>
