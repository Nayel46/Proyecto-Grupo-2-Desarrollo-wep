<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

    <!-- HEADER GENERAL (dos franjas, igual que el Panel Médico) -->
    <header th:replace="~{general/fragmentos :: header}"></header>

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold"
                    th:text="${rolActual == 'DOCTOR'} ? 'Mi agenda médica' : 'Mis citas médicas'">
                    Mis citas médicas
                </h2>

                <p class="text-muted mb-0">
                    Consulta y administra tus citas médicas.
                </p>
            </div>

            <th:block th:if="${rolActual == 'PACIENTE'}">
                <div th:replace="~{cita/fragmentos :: botonAgendar}"></div>
            </th:block>

        </div>

        <div th:replace="~{cita/fragmentos :: mensajes}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body">

                <div th:if="${#lists.isEmpty(citas)}"
                     class="text-center py-5">

                    <h5>No hay citas registradas</h5>

                    <p class="text-muted">
                        Actualmente no tienes citas médicas para mostrar.
                    </p>

                    <a th:if="${rolActual == 'PACIENTE'}"
                       th:href="@{/cita/agendar}"
                       class="btn btn-primary">
                        Agendar mi primera cita
                    </a>

                </div>

                <div th:replace="~{cita/fragmentos :: tablaCitas}"></div>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="boton boton-gris">
                Volver al inicio
            </a>
        </div>

    </main>

    <!-- FOOTER GENERAL -->
    <footer th:replace="~{general/fragmentos :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
