<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis citas - HealthNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                HealthNow
            </a>
            <span class="navbar-text text-white">
                Gestión de citas médicas
            </span>
        </div>
    </nav>

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold"
                    th:text="${rolActual == 'DOCTOR'} ? 'Mi agenda médica' : 'Mis citas médicas'">
                    Mis citas médicas
                </h2>

                <p class="text-muted mb-0">
                    Consulta y administra tus citas médicas.
                </p>
            </div>

            <div th:if="${rolActual == 'PACIENTE'}"
                 th:replace="~{cita/fragmentos :: botonAgendar}">
            </div>

        </div>

        <div th:replace="~{cita/fragmentos :: mensajes}">
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">

                <div th:if="${#lists.isEmpty(citas)}"
                     class="text-center py-5">

                    <h5>No hay citas registradas</h5>

                    <p class="text-muted">
                        Actualmente no tienes citas médicas para mostrar.
                    </p>

                    <a th:if="${rolActual == 'PACIENTE'}"
                       th:href="@{/cita/agendar}"
                       class="btn btn-outline-primary">
                        Agendar mi primera cita
                    </a>

                </div>

                <div th:unless="${#lists.isEmpty(citas)}"
                     th:replace="~{cita/fragmentos :: tablaCitas}">
                </div>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                Volver al inicio
            </a>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
